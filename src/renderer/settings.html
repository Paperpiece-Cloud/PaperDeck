<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; frame-src 'self'; connect-src https:;">
  <title>PaperDeck 设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-bg" aria-hidden="true">
    <div class="bg-base"></div>
    <div class="bg-blob blob-a"></div>
    <div class="bg-blob blob-b"></div>
    <div class="bg-blob blob-c"></div>
    <div class="bg-grain"></div>
  </div>

  <div class="window-bar">
    <div class="window-drag">
      <span class="window-eyebrow">PAPERDECK</span>
      <span class="window-separator"></span>
      <span class="window-caption">副屏仪表盘</span>
    </div>
    <div class="window-controls">
      <button class="window-button" id="minimizeButton" title="最小化" aria-label="最小化"></button>
      <button class="window-button" id="maximizeButton" title="最大化" aria-label="最大化"></button>
      <button class="window-button close" id="closeButton" title="关闭" aria-label="关闭"></button>
    </div>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-orb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="8.6" opacity=".32"/>
            <path d="M4.2 14.2c2.9-4.9 5.6 4.6 8.5-.2 1.6-2.6 3.1-1.2 4.4.2"/>
          </svg>
        </div>
        <div class="brand-copy">
          <b>PaperDeck</b>
          <span>SECONDARY DISPLAY</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-display" id="sidebarDisplay">
          <span class="display-dot"></span>
          <div><b>正在寻找副屏</b><span>798 × 480</span></div>
        </div>
        <div class="sidebar-version" id="sidebarVersion">v1.0.0</div>
      </div>
    </aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1 id="pageTitle">总览</h1>
          <p id="pageSubtitle">一台安静、漂亮的桌面状态屏</p>
        </div>
        <div class="header-actions">
          <span class="save-state" id="saveState"></span>
          <button class="header-button" id="previewRefresh" title="刷新副屏预览">
            <span id="refreshIcon"></span>
          </button>
        </div>
      </header>
      <div class="view" id="view"></div>
      <div class="content-fade"></div>
    </main>
  </div>

  <div class="toast-root" id="toastRoot"></div>
  <div id="modalRoot"></div>
  <script src="icons.js"></script>
  <script src="settings.js"></script>
</body>
</html>
